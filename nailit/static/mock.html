<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>NailIt mock</title>
<style>
  body { font: 15px/1.5 -apple-system, system-ui, sans-serif; max-width: 860px; margin: 24px auto; padding: 0 16px; color: #222; }
  fieldset { border: 1px solid #ddd; border-radius: 8px; margin-bottom: 12px; }
  label { margin-right: 14px; }
  #log p { margin: 6px 0; padding: 8px 10px; border-radius: 8px; }
  .interviewer { background: #f1f3f8; }
  .candidate { background: #eef8ee; }
  .meta { color: #777; font-size: 12px; }
  #status { font-weight: 600; margin: 10px 0; }
  #talk { font-size: 18px; padding: 14px 28px; }
  #talk.on { background: #d33; color: #fff; }
  video { width: 200px; float: right; border-radius: 8px; }
</style>
</head>
<body>
<h1>NailIt mock interview</h1>
<fieldset id="setup">
  <label>Round <select id="round"></select></label>
  <label>Mode <select id="mode"></select></label>
  <label>Company <select id="company"><option value="">(none)</option></select></label>
  <label>Temperament <select id="temperament"><option value="">(default)</option></select></label>
  <br>
  <label>Input <select id="input">
    <option value="ptt">Push-to-talk (hold Space)</option>
    <option value="vad">Hands-free (Silero VAD, barge-in)</option>
    <option value="text">Text only</option>
  </select></label>
  <label><input type="checkbox" id="webcam"> Record webcam locally</label>
  <button id="start">Start</button>
</fieldset>
<video id="preview" muted playsinline hidden></video>
<div id="status">Pick a round and press Start.</div>
<button id="talk" hidden>Hold to talk</button>
<form id="textForm" hidden><textarea id="text" rows="4" style="width:100%"></textarea><button>Send</button></form>
<div id="log"></div>

<script>
const $ = (id) => document.getElementById(id);
const IN_RATE = 16000, OUT_RATE = 24000;
let ws = null, mockId = null, ctx = null, playAt = 0, sources = [], held = false, mode = "ptt";
let camRecorder = null, camUploads = Promise.resolve(), camLost = 0;

async function api(path, body, form) {
  const res = await fetch(path, form ? {method: "POST", body} : body ? {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)} : {});
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || data.detail || res.statusText);
  return data;
}
function say(role, text, meta) {
  const p = document.createElement("p");
  p.className = role;
  p.textContent = (role === "interviewer" ? "Interviewer: " : "You: ") + text;
  if (meta) { const m = document.createElement("div"); m.className = "meta"; m.textContent = meta; p.appendChild(m); }
  $("log").appendChild(p);
  p.scrollIntoView();
  return p;
}
const status = (text) => ($("status").textContent = text);

async function loadOptions() {
  const o = await api("/interview/options");
  for (const r of o.rounds) $("round").add(new Option(`${r.label} (${r.minutes} min)`, r.id));
  for (const m of o.modes) { const opt = new Option(`${m.id}: ${m.label}${m.locked ? " (locked)" : ""}`, m.id); opt.disabled = m.locked; $("mode").add(opt); }
  for (const c of o.companies) $("company").add(new Option(c.name, c.id));
  for (const t of o.temperaments) $("temperament").add(new Option(t.label, t.id));
}

// Mic → 16 kHz 16-bit PCM over the websocket (an AudioWorklet downsamples in the audio thread).
const WORKLET = `class Pcm extends AudioWorkletProcessor {
  constructor() { super(); this.buf = []; this.ratio = sampleRate / ${IN_RATE}; this.pos = 0; }
  process(inputs) {
    const ch = inputs[0][0]; if (!ch) return true;
    for (; this.pos < ch.length; this.pos += this.ratio) this.buf.push(ch[Math.floor(this.pos)]);
    this.pos -= ch.length;
    if (this.buf.length >= 320) {
      const out = new Int16Array(this.buf.length);
      this.buf.forEach((s, i) => (out[i] = Math.max(-1, Math.min(1, s)) * 32767));
      this.port.postMessage(out.buffer, [out.buffer]); this.buf = [];
    }
    return true;
  }
}
registerProcessor("pcm", Pcm);`;

async function startMic() {
  ctx = new AudioContext();
  const stream = await navigator.mediaDevices.getUserMedia({audio: {echoCancellation: true, noiseSuppression: true}});
  await ctx.audioWorklet.addModule(URL.createObjectURL(new Blob([WORKLET], {type: "text/javascript"})));
  const node = new AudioWorkletNode(ctx, "pcm");
  node.port.onmessage = (e) => { if (ws && ws.readyState === 1) ws.send(e.data); };
  const mute = ctx.createGain();
  mute.gain.value = 0;
  ctx.createMediaStreamSource(stream).connect(node);
  node.connect(mute).connect(ctx.destination);  // a worklet only runs while connected to the destination
}

function play(buffer) {
  if (!ctx) ctx = new AudioContext();
  const pcm = new Int16Array(buffer), audio = ctx.createBuffer(1, pcm.length, OUT_RATE), data = audio.getChannelData(0);
  pcm.forEach((s, i) => (data[i] = s / 32768));
  const src = ctx.createBufferSource();
  src.buffer = audio; src.connect(ctx.destination);
  playAt = Math.max(playAt, ctx.currentTime);
  src.start(playAt); playAt += audio.duration;
  sources.push(src);
  src.onended = () => {
    sources = sources.filter((s) => s !== src);
    // The server sends audio faster than real time, so only the page knows when the interviewer stopped talking.
    if (!sources.length && ws && ws.readyState === 1) ws.send(JSON.stringify({type: "played"}));
  };
}
function clearPlayback() { sources.forEach((s) => s.stop()); sources = []; playAt = 0; }

function ready() {
  if (mode === "text") { status("Type your answer."); $("textForm").hidden = false; }
  else if (mode === "ptt") { status("Hold Space (or the button) while you answer."); $("talk").hidden = false; }
  else status("Listening… answer when ready. Talking over the interviewer interrupts it.");
}

function onEvent(e) {
  if (e.type === "question" || e.type === "turn") {
    if (e.candidate) say("candidate", e.candidate, e.filled_pauses != null ? `${e.filled_pauses} filled pauses` : "");
    say("interviewer", e.interviewer, e.event ? `event: ${e.event}` : "");
    if (!e.done) ready();
  } else if (e.type === "latency") {
    const p = [...document.querySelectorAll(".interviewer")].pop();
    if (p) { const m = document.createElement("div"); m.className = "meta";
      m.textContent = `last word → voice ${e.latency_s}s · stt ${e.stt_s}s · llm first token ${e.llm_ttft_s}s (total ${e.llm_s}s) · tts ${e.tts_s}s`; p.appendChild(m); }
  } else if (e.type === "listening" && e.reason === "cut") {
    held = false; $("talk").classList.remove("on"); status("Interrupted.");
  } else if (e.type === "listening") status("Thinking…");
  else if (e.type === "clear") clearPlayback();
  else if (e.type === "error") status("Error: " + e.error);
  else if (e.type === "done") finish();
}

async function finish() {
  status("Mock finished.");
  $("talk").hidden = true; $("textForm").hidden = true;
  if (camRecorder) {
    camRecorder.onstop = () => camUploads.then(() => status(camLost
      ? `Mock finished. Webcam video is INCOMPLETE: ${camLost} chunk(s) of 10 s could not be saved.`
      : "Mock finished. Webcam video saved locally."));
    camRecorder.stop();
  }
  const summary = await api(`/interview/get?mock_id=${mockId}`);
  say("interviewer", "(end of mock)", JSON.stringify({scores: summary.scores, stories_used: summary.stories_used}));
}

$("start").onclick = async () => {
  $("setup").disabled = true;
  mode = $("input").value;
  try {
    if (mode !== "text") await startMic();
    let cam = null;
    if ($("webcam").checked) {
      cam = await navigator.mediaDevices.getUserMedia({video: true, audio: true});
      $("preview").srcObject = cam; $("preview").hidden = false; $("preview").play();
    }
    const started = await api("/interview/start", {round_id: $("round").value, mode: $("mode").value,
      company_id: $("company").value || null, temperament_id: $("temperament").value || null});
    mockId = started.mock_id;
    if (cam) {
      camRecorder = new MediaRecorder(cam, {mimeType: "video/webm"});
      // Each 10 s chunk is appended to the file on disk in order, so a long loop never sits in browser memory.
      camRecorder.ondataavailable = (e) => {
        camUploads = camUploads.then(async () => {
          if (!e.data.size) return;
          for (let attempt = 1; attempt <= 3; attempt++) {
            const form = new FormData();
            form.append("mock_id", mockId);
            form.append("video", e.data, "webcam.webm");
            try { return await api("/voice/video", form, true); } catch { await new Promise((r) => setTimeout(r, attempt * 1000)); }
          }
          camLost += 1;
        });
      };
      camRecorder.start(10000);
    }
    ws = new WebSocket(`ws://${location.host}/voice/ws/${mockId}?input=${mode}`);
    ws.binaryType = "arraybuffer";
    ws.onopen = () => ws.send(JSON.stringify({type: "ready"}));
    ws.onmessage = (m) => (typeof m.data === "string" ? onEvent(JSON.parse(m.data)) : play(m.data));
    ws.onclose = (e) => { if (e.code === 4404) status("Mock not found."); };
  } catch (e) { status("Error: " + e.message); $("setup").disabled = false; }
};

const ptt = (down) => {
  if ($("talk").hidden || held === down || !ws) return;
  held = down;
  $("talk").classList.toggle("on", down);
  if (!down) $("talk").hidden = true;
  status(down ? "Recording…" : "Thinking…");
  ws.send(JSON.stringify({type: "ptt", down}));
};
$("talk").onmousedown = () => ptt(true); $("talk").onmouseup = () => ptt(false);
document.addEventListener("keydown", (e) => { if (e.code === "Space" && e.target.tagName !== "TEXTAREA") { e.preventDefault(); if (!e.repeat) ptt(true); } });
document.addEventListener("keyup", (e) => { if (e.code === "Space" && e.target.tagName !== "TEXTAREA") { e.preventDefault(); ptt(false); } });

$("textForm").onsubmit = (e) => {
  e.preventDefault();
  const text = $("text").value.trim();
  if (!text || !ws) return;
  $("text").value = ""; $("textForm").hidden = true;
  status("Thinking…");
  ws.send(JSON.stringify({type: "text", text}));
};

window.addEventListener("beforeunload", () => { if (ws && ws.readyState === 1) ws.send(JSON.stringify({type: "end"})); });
loadOptions().catch((e) => status("Error loading library: " + e.message));
</script>
</body>
</html>
