[project]
name = "nailit"
version = "0.1.0"
description = "Personal interview prep and practice tool (local only)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<0.120",
    "uvicorn>=0.30,<0.35",
    "openai>=1.50,<2",
    "pydantic>=2.8,<3",
    "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "httpx>=0.27,<0.29"]

[project.scripts]
nailit = "nailit.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["nailit", "nailit.prep"]
