[project]
name = "nailit"
version = "0.1.0"
description = "Personal interview prep and practice tool (local only)"
requires-python = ">=3.11,<3.15"
dependencies = [
    "fastapi>=0.115,<0.120",
    "uvicorn>=0.30,<0.35",
    "openai>=1.50,<2",
    "pydantic>=2.8,<3",
    "python-dotenv>=1.0,<2",
    "pyyaml>=6.0,<7",
    "jsonschema>=4.20,<5",
    "python-multipart>=0.0.9,<0.1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "httpx>=0.27,<0.29"]
voice = [
    "pipecat-ai[silero,websocket]>=1.15,<2",
    "mlx-whisper>=0.4,<0.5; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "mlx-audio>=0.6,<0.7; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[project.scripts]
nailit = "nailit.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["nailit", "nailit.prep", "nailit.interview"]

[tool.setuptools.package-data]
nailit = ["schemas/*.json", "static/*.html"]
