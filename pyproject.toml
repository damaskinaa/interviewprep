[project]
name = "nailit"
version = "0.1.0"
description = "Personal interview prep and practice tool (local only)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30,<0.35",
    "openai>=1.50,<2",
    "pydantic>=2.8,<3",
    "python-dotenv>=1.0,<2",
    "pyyaml>=6.0,<7",
    "jsonschema>=4.20,<5",
    "python-multipart>=0.0.9,<0.1",
]

[project.optional-dependencies]
dev = ["pytest>=9.0.3,<10", "httpx>=0.27,<0.29"]
voice = ["mlx-whisper>=0.4,<0.5; sys_platform == 'darwin' and platform_machine == 'arm64'"]
research = [
    "anthropic>=2.7.0",
    "sentence-transformers>=6.2.0",
    "youtube-transcript-api>=1.2.5",
    "yt-dlp>=2026.10.26",
]

[project.scripts]
nailit = "nailit.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["nailit", "nailit.prep", "nailit.interview", "nailit.answers"]

[tool.setuptools.package-data]
nailit = ["schemas/*.json", "static/*.html", "answers/data/*"]
