name: Tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - run: uv lock --check
      - run: uv sync --extra dev
      - run: uvx ruff check --select F nailit tests
      - run: uv run pytest tests -q
      - name: Simulated candidate (fake STT/TTS/LLM)
        run: |
          set -o pipefail
          uv run python -m nailit.sim_candidate --all --fake | tee sim_report.md
          cat sim_report.md >> "$GITHUB_STEP_SUMMARY"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build
