version: "3.9"

x-backend: &backend
  build: .
  env_file:
    - .env
  environment:
    REDIS_URL: redis://redis:6379/0
    DATA_DIR: /app/data
  volumes:
    - ./jobs:/app/jobs
    - ./data:/app/data
  restart: unless-stopped
  depends_on:
    - redis

services:
  api:
    <<: *backend
    ports:
      - "8000:8000"

  worker:
    <<: *backend
    command: ["rq", "worker", "--url", "redis://redis:6379/0"]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
